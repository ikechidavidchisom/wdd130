    <section class="employee-profiles">
      <h2>Meet Our Team</h2>
      <figure>
        <img src="images/employee1.png" alt="Jane Doe">
        <figcaption>Jane Doe – Customer Service Manager</figcaption>
      </figure>
      <figure>
        <img src="images/employee2.png" alt="John Smith">
        <figcaption>John Smith – Tour Guide</figcaption>
      </figure>
      <figure>
        <img src="images/employee3.png" alt="Emily Rivers">
        <figcaption>Emily Rivers – Safety Coordinator</figcaption>
      </figure>
    </section>

    <section class="contact-form">
      <h2>Send Us a Message</h2>
      <form>
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" required>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>

        <p>Purpose of Message:</p>
        <label><input type="radio" name="purpose" value="general"> General Inquiry</label>
        <label><input type="radio" name="purpose" value="reservation"> Reservation Question</label>
        <label><input type="radio" name="purpose" value="suggestion"> Website Suggestion</label>

        <label for="message">Message:</label>
        <textarea id="message" name="message" rows="5"></textarea>

        <label><input type="checkbox" name="subscribe"> Please subscribe me to the monthly newsletter</label>

        <button type="submit">Send Message</button>
      </form>
    </section>
    </main>
